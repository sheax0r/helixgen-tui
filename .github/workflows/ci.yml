# Run lint + the test suite on every PR and on pushes to main.
#
# Mirrors helixgen-core's CI conventions (setup-python 3.12, pip install -e,
# python -m pytest -q); ruff is this repo's linter.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned deliberately: an unpinned install made lint a moving target.
      # ruff 0.16.0 broadened its default rule set (RUF059, RUF012, BLE001,
      # I001, S110/S112, UP035, ...) and turned main red — 65 findings, none
      # from any change in flight. Adopting those rules is real work, tracked
      # as docs/BACKLOG.md #18; until then the linter's version is fixed so a
      # red lint means "this branch broke something", not "upstream shipped".
      - name: Install ruff
        run: python -m pip install ruff==0.15.0

      - name: Ruff lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package + dev extras
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q
